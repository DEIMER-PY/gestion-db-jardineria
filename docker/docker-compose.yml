services:
  mysql-jardineria:
    image: mysql:8.0
    container_name: jardineria-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: jardineria
      MYSQL_USER: jardineria
      MYSQL_PASSWORD: password
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - ./init/01-jardineria.sql:/docker-entrypoint-initdb.d/01-jardineria.sql:ro
      - ./init/02-chat.sql:/docker-entrypoint-initdb.d/02-chat.sql:ro
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Consola web de administración: http://localhost:8090  (usuario: root / password)
  phpmyadmin:
    image: phpmyadmin:5
    container_name: jardineria-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql-jardineria:
        condition: service_healthy
    environment:
      PMA_HOST: mysql-jardineria
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8090}:80"

volumes:
  mysql_data:
